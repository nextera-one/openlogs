[build-system]
requires = ["hatchling>=1.26.0"]
build-backend = "hatchling.build"

[project]
name = "openlogs-sdk-python"
version = "2.2.0"
description = "Core Python SDK for OpenLogs v2 hash-chained records"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "NextEra.One" }]
dependencies = [
  "cryptography>=45.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openlogs_sdk"]
